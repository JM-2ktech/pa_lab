title: "Power Automate 업무 자동화 실습"
description: >-
  Cloud Flow로 하는 DPA와 Power Automate Desktop으로 하는 RPA를 다루는 2일 핸즈온 과정입니다.
baseurl: "/pa_lab"
url: "https://jm-2ktech.github.io"

theme: just-the-docs
plugins:
  - jekyll-feed

# 코드블록 복사 버튼 — 이 교안은 복붙이 주 동작이라 명시해 둔다.
# 버튼 스타일은 _sass/custom/custom.scss(공유 인프라, 정본 cs_lab)에 있다.
enable_copy_code_button: true

search_enabled: true
search:
  heading_level: 2
  previews: 3

aux_links:
  "Microsoft Learn Power Automate":
    - "https://learn.microsoft.com/ko-kr/power-automate/"
  "GitHub":
    - "https://github.com/JM-2ktech/pa_lab"

# 교육 회차마다 바뀌는 값 — 본문은 {{ site.pa.<키> }} 로 참조한다. 회차가 바뀌면 여기만 고친다.
# ⚠️ 이 파일은 공개 저장소에 올라간다.
pa:
  sharepoint_site: "https://2ktech.sharepoint.com/sites/pa_practice"
  environment: "edu261006"

nav_sort: order
color_scheme: light

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # 모의 공고 사이트는 테마 밖의 정적 페이지다. 레이아웃을 씌우지 않는다.
  - scope:
      path: "practice"
    values:
      layout: null
      sitemap: false

callouts_level: quiet
callouts:
  note:
    title: 팁
    color: blue
  time:
    title: 시간
    color: green
  warning:
    title: 주의
    color: red
  important:
    title: 핵심
    color: yellow

exclude:
  - _instructions/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/